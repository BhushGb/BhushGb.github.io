<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ site.title }}</title>
</head>

<body>

<div style="display:flex; max-width:900px; margin:auto; gap:40px; padding:40px;">

  <!-- SIDEBAR (from config.yml) -->
  <aside style="width:200px; flex-shrink:0; position:sticky; top:20px;">
    
    {% if site.avatar %}
      <img src="{{ site.avatar }}"
           style="width:120px; border-radius:50%;">
    {% endif %}

    <h2>{{ site.title }}</h2>

    <p>{{ site.description }}</p>

  </aside>

  <!-- MAIN CONTENT -->
  <main style="flex:1;">
    {{ content }}
  </main>

</div>

</body>
</html>
